<!DOCTYPE html>
<html>

<head>

    <title>Update Task</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm p-4">

                <h3 class="mb-4 text-center">Update Task</h3>

                <form method="POST">

                    <label class="form-label">Task Title</label>
                    <input type="text" class="form-control mb-3" name="title" value="{{ task.title }}">

                    <label class="form-label">Description</label>
                    <textarea class="form-control mb-3" name="description">{{ task.description }}</textarea>

                    <div class="row">

                        <div class="col-md-6">

                            <label class="form-label">Priority</label>
                            <input type="text" class="form-control mb-3" name="priority" value="{{ task.priority }}">

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">Status</label>
                            <input type="text" class="form-control mb-3" name="status" value="{{ task.status }}">

                        </div>

                    </div>

                    <button type="submit" class="btn btn-warning w-100">
                        Update Task
                    </button>

                    <a href="/dashboard" class="btn btn-secondary w-100 mt-2">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
