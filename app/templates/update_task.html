<h1>Update Task</h1>

<form method="POST">

    <input type="text" name="title" value="{{ task.title }}">

    <br><br>

    <textarea name="description">{{ task.description }}</textarea>

    <br><br>

    <input type="text" name="priority" value="{{ task.priority }}">

    <br><br>

    <input type="text" name="status" value="{{ task.status }}">

    <br><br>

    <button type="submit">
        Update Task
    </button>

</form>
